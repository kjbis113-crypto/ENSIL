; ENSIL 목업 펌웨어 — ESP32-C3 SuperMini / ESP32-CAM
; 하나의 소스(src/main.cpp)를 UNIT 빌드 플래그로 갈라 쓴다.
;   pio run -e unit1 -t upload      # NO.01 십자형 (스위치 → 네오픽셀 17구)
;   pio run -e unit2 -t upload      # NO.02 텐던   (PIR → 서보)
;   pio run -e unit3 -t upload      # NO.03 스피커 (카메라 → 앰프)
; 네트워크/브릿지 주소는 include/config.h
;
;   pio run -e hub -t upload        # 전용 허브 보드 — 전원만 넣으면 AP "archive" 를 띄운다 (공유기 역할)
; (docs/EXHIBITION_SETUP.md §6)

[platformio]
default_envs = unit1

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  gilmaimon/ArduinoWebsockets@^0.5.4
  bblanchon/ArduinoJson@^7.0.0

; ── ESP32-C3 SuperMini 공통 ─────────────────────────────────
[c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:unit1]
extends = c3
build_flags = ${c3.build_flags} -DUNIT=1
lib_deps = ${env.lib_deps}
  adafruit/Adafruit NeoPixel@^1.12.0

[env:unit2]
extends = c3
build_flags = ${c3.build_flags} -DUNIT=2
lib_deps = ${env.lib_deps}
  madhephaestus/ESP32Servo@^3.0.5

; NO.03 — 카메라 보드. AI-Thinker ESP32-CAM 이면 이대로, 다른 보드면 board 만 바꾼다.
; 카메라 감지 코드는 기존 프로젝트 것을 sense() 안에 붙인다.
[env:unit3]
platform = espressif32
board = esp32cam
build_flags = -DUNIT=3
lib_deps = ${env.lib_deps}

; 전용 허브 — 센서·동작 없이 AP 만. 어떤 ESP32 든 됨 (C3 SuperMini 기준)
[env:hub]
extends = c3
build_flags = ${c3.build_flags} -DHUB=1
lib_deps =
